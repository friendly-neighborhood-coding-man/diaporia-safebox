# Disposable security-audit workflow: CodeQL Advanced setup for JavaScript/TypeScript.
# Lives only on security-audit/* branches. No autofix, no auto-merge, no extra AI scans.
name: CodeQL security audit

on:
  push:
    branches:
      - 'security-audit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: sarif-results

      - name: Print findings summary
        if: always()
        run: |
          for f in sarif-results/*.sarif; do
            [ -f "$f" ] || continue
            echo "== $f"
            jq -r '.runs[] | "results: \(.results | length)", (.results[] | "\(.level // "warning")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\t\(.message.text | gsub("\n"; " ") | .[0:200])")' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
