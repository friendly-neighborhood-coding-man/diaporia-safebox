name: SafeBox mock CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mock-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
