[package]
name = "safebox-payment"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "DIAPORIA SafeBox V1: owner-signed, one-use NEAR testnet payment contract"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
bs58 = "0.5"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
