[package]
name = "safebox-v3-vault"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "DIAPORIA SafeBox V3: on-chain purpose/authority/recovery enforcement (local sandbox only; NOT deployed)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
